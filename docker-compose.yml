services:
  # Aplica el esquema (y datos de ejemplo con --seed) y termina. Usa el usuario
  # administrador (notes_user, con DDL) y reintenta mientras MySQL arranca.
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-php-migrations
    command: ["php", "bin/migrate.php", "--seed"]
    environment:
      DB_HOST: notes-mysql
      DB_PORT: "3306"
      DB_NAME: notes
      ADMIN_DB_USER: notes_user
      ADMIN_DB_PASSWORD: notes_password
    networks:
      - notes-net
    restart: "no"

  # API de notas en PHP (Apache + mod_php). Se conecta al MySQL que ya
  # levanta el otro proyecto, reutilizando su red y su base de datos.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-php-api
    ports:
      - "8081:80"
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      # notes-mysql es el nombre del contenedor de MySQL en su red.
      DB_HOST: notes-mysql
      DB_PORT: "3306"
      DB_NAME: notes
      # Usuario de aplicación: solo DML (SELECT/INSERT/UPDATE/DELETE).
      DB_USER: notes_app
      DB_PASSWORD: notes_app_password
      RATE_LIMIT_PERMIT: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      AUTH_KEY_CACHE_SECONDS: "60"
      MAX_BODY_BYTES: "1048576"
    networks:
      - notes-net
    restart: unless-stopped

networks:
  # Red externa creada por el docker-compose del proyecto de MySQL. Así ambos
  # servicios comparten la misma base de datos sin duplicar el contenedor.
  notes-net:
    external: true
    name: crud-servicios-rest-aspnet-csharp_default
